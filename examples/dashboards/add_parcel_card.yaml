# Add a bpost parcel straight from a dashboard — no diving into the options.
#
# A bpost hub is scoped to one delivery postal code (set once, at setup), so
# tracking a parcel normally needs only its barcode:
#   - bpost.track_parcel   (barcode, optional postal_code)
#   - bpost.untrack_parcel (barcode)
#
# The optional postal_code field only matters if you have more than one
# bpost hub (e.g. a second delivery address) — it picks which hub to add the
# parcel to. With a single hub, leave it out entirely.
#
# This example wires a text field + a button on a Lovelace card to
# bpost.track_parcel. It needs one helper and one script (below), then the
# card.

# ---------------------------------------------------------------------------
# 1) Helper — Settings → Devices & Services → Helpers → Create → Text,
#    or in configuration.yaml:
# ---------------------------------------------------------------------------
input_text:
  bpost_new_parcel_barcode:
    name: New bpost barcode
    max: 40

# ---------------------------------------------------------------------------
# 2) Script — reads the barcode field, tracks the parcel, then clears it.
#    Add to scripts.yaml (or Settings → Automations & Scenes → Scripts).
# ---------------------------------------------------------------------------
bpost_track_new_parcel:
  alias: "bpost: track the parcel in the input box"
  sequence:
    - condition: template
      value_template: >-
        {{ states('input_text.bpost_new_parcel_barcode') | trim != '' }}
    - action: bpost.track_parcel
      data:
        barcode: "{{ states('input_text.bpost_new_parcel_barcode') | trim }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.bpost_new_parcel_barcode
      data:
        value: ""

# ---------------------------------------------------------------------------
# 3) Lovelace card — paste into a dashboard (Edit → raw config, or add a
#    manual card). Fill in the barcode, press the button.
# ---------------------------------------------------------------------------
